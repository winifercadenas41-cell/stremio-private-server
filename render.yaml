services:
  - type: web
    name: stremio-private-server
    env: docker
    plan: free
    region: oregon
    buildCommand: ""
    startCommand: ""
    envVars:
      - key: PORT
        value: 3000
      - key: TORBOX_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: BASE_URL
        sync: false
      - key: SERVICE_NAME
        value: "Torbox VIP Streams"
